[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlrVp"
dynamic = ["version"]
description = "mlrVp - A modern Python reimplementation of mlrV2, a sampling instrument for grid-based music controllers"
readme = "README.md"
license = {text = "MIT WITH Commons-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "mlrVp Contributors"},
]
keywords = ["monome", "sampling", "grid", "music", "audio", "mlr"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # PySide6 6.12.0 mis-refcounts Signal.emit()'s return value, which aborts
    # on Python < 3.12 — see requirements.txt.
    "PySide6-Essentials>=6.5,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.5; python_version >= '3.12'",
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "python-rtmidi>=1.5",
    "python-osc>=1.8",
    "pymonome>=0.10",
    "pyserial>=3.5",
    "resampy>=0.4",
    "librosa>=0.10",
    "numba>=0.57",
    "pedalboard>=0.9",
    # Python 3.13+ removed audioop, aifc, chunk, and sunau
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "standard-aifc>=3.13.0; python_version >= '3.13'",
    "standard-chunk>=3.13.0; python_version >= '3.13'",
    "standard-sunau>=3.13.0; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
]
link = ["aalink>=0.2.1"]

[project.scripts]
mlrvp = "mlrvp.main:main"

[project.gui-scripts]
mlrvp-gui = "mlrvp.main:main"

[tool.setuptools.dynamic]
version = {attr = "mlrvp.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mlrvp*"]

[tool.setuptools.package-data]
mlrvp = ["resources/*.png", "resources/*.ico", "resources/*.icns", "resources/*.html", "resources/*.svg", "resources/factory_racks/*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that create Qt widgets (require QT_QPA_PLATFORM=offscreen in CI)",
    "slow: tests that take more than ~1s (e.g. real-time clock/thread tests)",
]

[tool.coverage.run]
source = ["mlrvp"]
omit = [
    "mlrvp/main.py",
    "mlrvp/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Correctness-focused rules only (pyflakes + likely-bug checks); no style churn.
select = [
    "E9",       # syntax errors
    "F",        # pyflakes: undefined names, unused imports, ...
    "PLE",      # pylint errors
    "B006", "B008", "B012", "B018", "B020", "B904",  # bugbear: likely bugs
    "PLW0120",  # else on a loop without break
    "RUF006",   # dangling asyncio task
]
