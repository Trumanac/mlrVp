name: PR Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:          # reused by build.yml before release builds

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ruff (rules in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check mlrvp tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.lock && ', locked' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest versions of everything in requirements.txt: early warning
          # for upstream breakage.
          - { os: ubuntu-latest,  python-version: '3.11' }
          - { os: ubuntu-latest,  python-version: '3.12', coverage: true }
          - { os: ubuntu-latest,  python-version: '3.13' }
          - { os: windows-latest, python-version: '3.12' }
          - { os: macos-latest,   python-version: '3.12' }
          # The exact pinned set release builds ship (requirements-lock.txt)
          - { os: ubuntu-latest,  python-version: '3.12', lock: true }
          - { os: windows-latest, python-version: '3.12', lock: true }
          - { os: macos-latest,   python-version: '3.12', lock: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      - name: Install Linux audio + Qt headless dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 portaudio19-dev \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.lock && 'requirements-lock.txt' || 'requirements.txt' }}
          pip install pytest pytest-qt pytest-cov pytest-mock

      - name: Verify package imports
        run: python -c "import mlrvp, mlrvp.app; print('mlrvp', mlrvp.__version__)"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest -v
          ${{ matrix.coverage && '--cov=mlrvp --cov-report=term-missing --cov-report=xml' || '' }}

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
