name: Build mlrVp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:     # Manual trigger from GitHub UI (builds artifacts, no release)

permissions:
  contents: read

jobs:
  checks:
    # Same lint + test matrix as pull requests — never ship a red build.
    uses: ./.github/workflows/pr_check.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match mlrvp.__version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('mlrvp/__init__.py').read()).group(1))")
          echo "mlrvp.__version__ = ${ver}, tag = ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mlrvp.__version__ (${ver}). Bump the version or re-tag."
            exit 1
          fi

  build:
    needs: [checks, version]
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: mlrVp-windows
            zip_name: mlrVp-windows.zip
          - os: macos-latest
            artifact: mlrVp-macos
            zip_name: mlrVp-macos.zip
          - os: ubuntu-22.04
            artifact: mlrVp-linux
            zip_name: mlrVp-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libportaudio2 portaudio19-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Locked versions: a new upstream release can't silently change a
          # shipped build (PR checks still test the latest requirements.txt).
          pip install -r requirements-lock.txt
          pip install "pyinstaller>=6.0"

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/mlrVp/* -DestinationPath dist/${{ matrix.zip_name }}

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/mlrVp.app

      - name: Zip output (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ${{ matrix.zip_name }} mlrVp.app

      - name: Zip output (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ${{ matrix.zip_name }} mlrVp

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.zip_name }}
          # Releases keep their own copy of the zips; the artifacts are only
          # needed until the release job runs (or for testing a manual build).
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write        # create the GitHub release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          # Draft: review the notes and assets, then press "Publish" on GitHub.
          draft: true
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | Download |
            |----------|----------|
            | **Windows** | [mlrVp-windows.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mlrVp-windows.zip) |
            | **macOS** | [mlrVp-macos.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mlrVp-macos.zip) |
            | **Linux** | [mlrVp-linux.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/mlrVp-linux.zip) |

            ### Installation
            1. Download the zip for your platform above
            2. Extract to a folder of your choice
            3. Run `mlrVp.exe` (Windows), `mlrVp.app` (macOS), or `./mlrVp` (Linux)

            Updating from an older version? Your presets and settings now live outside the app folder — use
            **File → Import Data from Previous Version…** once to bring them across
            (see [Where your files are stored](https://github.com/${{ github.repository }}#where-your-files-are-stored)).

            > **Windows**: The app isn't code-signed yet — if SmartScreen says "Windows protected your PC", click **More info → Run anyway**.
            > **macOS** (Apple Silicon; on Intel Macs run from source): If you see "unidentified developer", right-click `mlrVp.app` → **Open** and click Open in the dialog. Or remove the quarantine flag via Terminal:
            > ```
            > xattr -dr com.apple.quarantine mlrVp.app
            > ```
            > **Linux**: You may need `chmod +x mlrVp` before running.

            ---
