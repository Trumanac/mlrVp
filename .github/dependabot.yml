version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # Keep Python dependencies up to date.
  #
  # Dependabot reads both requirements.txt (the loose ranges PR checks test)
  # and requirements-lock.txt (the pinned set release builds ship — also what
  # GitHub's security alerts watch).  One grouped PR per month bumps them
  # together; PR checks install the lock file too, so the update is tested
  # against exactly what would ship.  Security updates are never grouped away:
  # they open immediately.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"
